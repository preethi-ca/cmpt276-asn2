<!DOCTYPE html>
<html>
  <head>
    <title>Rating Details</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Rating Details</h1>

    <table>
      <tr>
        <th>Attribute</th>
        <th>Value</th>
      </tr>

      <tr>
        <td>Name</td>
        <td th:text="${rating.name}"></td>
      </tr>

      <tr>
        <td>Email</td>
        <td th:text="${rating.email}"></td>
      </tr>

      <tr>
        <td>Role Type</td>
        <td th:text="${rating.roleType}"></td>
      </tr>

      <tr>
        <td>Display Title</td>
        <td th:text="${rating.displayTitle}"></td>
      </tr>

      <tr>
        <td>Clarity</td>
        <td th:text="${rating.clarity}"></td>
      </tr>

      <tr>
        <td>Niceness</td>
        <td th:text="${rating.niceness}"></td>
      </tr>

      <tr>
        <td>Knowledgeable Score</td>
        <td th:text="${rating.knowledgeableScore}"></td>
      </tr>

      <tr>
        <td>Overall Score</td>
        <td th:text="${rating.overallScore}"></td>
      </tr>

      <tr>
        <td>Comment</td>
        <td th:text="${rating.comment}"></td>
      </tr>
    </table>
    <p>
      <a th:href="@{/ratings/edit(id=${rating.id})}">Edit Rating</a>
    </p>
    <!-- Delete by id (with a confirmation step OR a clear UX pattern) -->
    <form action="/ratings/delete" method="post" class="delete-form">
      <input type="hidden" name="id" th:value="${rating.id}" />
      <button
        type="submit"
        onclick="return confirm('Are you sure you want to delete this rating?');"
      >
        Delete Rating
      </button>
    </form>
    <p>
      <a href="/">Back to Home</a>
    </p>
  </body>
</html>
